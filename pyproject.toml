[project]
name = "plugin-chatbot"
version = "0.1.0"
description = "plugin-chatbot"
readme = "README.md"
requires-python = ">=3.10, <4.0"
dependencies = [
    "nonebot-plugin-alconna>=0.62.1",
    "nonebot2[fastapi]>=2.5.0",
    "openai>=3.42.0",
    "mcp>=1.0,<2.0",
    "pyttsx3>=2.90",
]

[project.optional-dependencies]
dev = [
    "pyright[nodejs]",
    "ruff"
]

[tool.nonebot]
plugin_dirs = ["plugin_chatbot/plugins"]
builtin_plugins = []

[tool.nonebot.adapters]
"@local" = []

[tool.nonebot.plugins]
"@local" = []
nonebot-plugin-alconna = ["nonebot_plugin_alconna"]

[tool.setuptools.package-data]
plugin_chatbot = ["plugins/*.html"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent", "agent.*", "plugin_chatbot", "plugin_chatbot.*"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
# For more rules, see https://docs.astral.sh/ruff/rules/.
select = [
    "F",     # Pyflakes
    "W",     # pycodestyle warnings
    "E",     # pycodestyle errors
    "I",     # isort
    "C90",   # mccabe
    "N",     # pep8-naming
    "PL",    # pylint
    "UP",    # pyupgrade
    "YTT",   # flake8-2020
    "ANN",   # flake8-annotations
    "ASYNC", # flake8-async
    "BLE",   # flake8-blind-except
    "FBT",   # flake8-boolean-trap
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "COM",   # flake8-commas
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "T10",   # flake8-debugger
    "ICN",   # flake8-import-conventions
    "PIE",   # flake8-pie
    "T20",   # flake8-print
    "PYI",   # flake8-pyi
    "Q",     # flake8-quotes
    "RSE",   # flake8-raise
    "RET",   # flake8-return
    "SIM",   # flake8-simplify
    "SLOT",  # flake8-slots
    "TID",   # flake8-tidy-imports
    "TC",    # flake8-type-checking
    "ARG",   # flake8-unused-arguments
    "PTH",   # flake8-use-pathlib
    # "ERA",   # eradicate
    "FAST",  # FastAPI
    "PERF",  # Perflint
    "PGH",   # pygrep-hooks
    "FURB",  # refurb
    "TRY",   # tryceratops
    "RUF",   # Ruff-specific rules
]
ignore = [
    "E402",    # module-import-not-at-top-of-file  # nonebot2 require() violates this
    "B008",    # function-call-in-default-argument  # nonebot2 Depends() without Annotated violates this
    "UP037",   # quoted-annotation
    # "RUF001",  # ambiguous-unicode-character-string
    # "RUF002",  # ambiguous-unicode-character-docstring
    # "RUF003",  # ambiguous-unicode-character-comment
    # "ANN201",  # missing-return-type-undocumented-public-function
    "ANN202",  # missing-return-type-private-function
    "ANN401",  # any-type
    "COM812",  # missing-trailing-comma
    "PLC0415", # import-outside-top-level
]
allowed-confusables = ["，", "。", "“", "”", "：", "；", "？", "！", "【", "】", "《", "》", "…", "—", "（", "）", "、"]

[tool.ruff.lint.per-file-ignores]
# 测试脚本是自包含的验证脚本，放宽严格样式规则（注解/打印/全局状态等）
"tests/*" = [
    "ANN",      # 注解
    "T201",     # print
    "PLW0603",  # global
    "PTH",      # pathlib 偏好
    "ARG",      # 未用参数
    "E501",     # 行宽
    "SIM",      # 简化建议
    "C901",     # 复杂度
    "PLR",      # 参数/分支数
    "FBT",      # 布尔参数
    "TRY",      # try 风格
    "PERF",     # 微优化
    "ASYNC",    # async 阻塞
    "BLE",      # 裸 except
    "TID",      # 相对导入
    "N",        # 命名
    "UP",       # 现代化
]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.pyright]
# For Pylance/Pyright configurations, see https://microsoft.github.io/pyright/#/configuration.
pythonVersion = "3.12"
pythonPlatform = "All"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.17.3",
]
